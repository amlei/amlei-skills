<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>{{title}}</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Serif+SC:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

{{callouts}}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:#f6f4ed;
  background-image:radial-gradient(circle,rgba(26,23,20,.02) 1px,transparent 1.5px);
  background-size:4px 4px;
  font-family:"Noto Serif SC","Cormorant Garamond","Songti SC",serif;
  color:#1a1714;
  font-size:16px;
  line-height:1.85;
  padding:40px 26px 46px;
  -webkit-text-size-adjust:100%;
}

.ink{position:relative;}

.seal{
  position:absolute;top:30px;right:26px;
  width:32px;height:32px;
  background:#b8312c;
  color:#f6f4ed;
  font-family:"Noto Serif SC",serif;font-weight:700;font-size:17px;
  display:flex;align-items:center;justify-content:center;
  border-radius:4px;
  transform:rotate(-4deg);
}

h1{
  font-family:"Noto Serif SC","Cormorant Garamond",serif;
  font-weight:700;
  font-size:28px;
  line-height:1.3;
  letter-spacing:.02em;
  color:#1a1714;
  margin:0 0 6px;
}
h1::after{
  content:"";
  display:block;
  width:36px;height:2px;
  background:#b8312c;
  margin-top:16px;
}

h2{
  font-family:"Noto Serif SC",serif;
  font-weight:600;
  font-size:20px;
  color:#1a1714;
  margin:30px 0 12px;
}
h2::before{
  content:"";
  display:inline-block;
  width:7px;height:7px;
  background:#b8312c;
  margin-right:10px;
  vertical-align:middle;
  transform:rotate(45deg);
}

h3{font-family:"Noto Serif SC",serif;font-weight:600;font-size:16.5px;color:#3a3530;margin:20px 0 8px;}

p{margin:13px 0;}
.ink>p:first-of-type::first-letter{
  font-family:"Noto Serif SC","Cormorant Garamond",serif;
  font-size:46px;
  font-weight:700;
  color:#b8312c;
  float:left;
  line-height:.9;
  padding:4px 8px 0 0;
}

strong{color:#1a1714;font-weight:700;}
em{color:#6b6358;}

a{color:#b8312c;text-decoration:none;border-bottom:1px solid rgba(184,49,44,.4);}

code{
  font-family:"JetBrains Mono","Courier New",monospace;
  font-size:.85em;
  color:#3a3530;
  background:#efece4;
  border:1px solid #dfd9cc;
  padding:1px 5px;
  border-radius:2px;
  word-break:break-word;
}
pre{
  background:#1a1714;
  color:#e8e3d8;
  border-radius:3px;
  padding:15px 16px;
  margin:16px 0;
  white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;
}
pre code{background:transparent;border:none;color:inherit;padding:0;font-size:12.5px;line-height:1.6;}

blockquote{
  margin:16px 0;
  padding:8px 18px;
  background:#efece4;
  color:#3a3530;
  font-style:italic;
  position:relative;
  border-radius:0 3px 3px 0;
}
blockquote::before{
  content:"";
  position:absolute;left:0;top:0;bottom:0;width:2px;
  background:#1a1714;opacity:.7;
}

ul,ol{padding-left:22px;margin:13px 0;}
li{margin:6px 0;}
li::marker{color:#b8312c;}

hr{border:none;border-top:1px solid #cfc8b8;margin:28px 0;position:relative;}
hr::after{
  content:"";
  position:absolute;left:50%;top:-3px;transform:translateX(-50%);
  width:6px;height:6px;background:#b8312c;border-radius:50%;
}

table{border-collapse:collapse;width:100%;margin:16px 0;font-size:14.5px;}
th,td{border:1px solid #cfc8b8;padding:8px 11px;text-align:left;}
th{background:#efece4;color:#1a1714;font-weight:600;}

img{max-width:100%;height:auto;border-radius:2px;}
</style>
</head>
<body>
<div class="ink">
<span class="seal">文</span>
{{body}}
</div>
</body>
</html>
