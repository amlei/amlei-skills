<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>{{title}}</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;800;900&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Serif+SC:wght@600;800&display=swap');

{{callouts}}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:#f6f4ee;
  font-family:"Inter","Noto Sans SC","PingFang SC",-apple-system,sans-serif;
  color:#26241f;
  font-size:15.5px;
  line-height:1.75;
  padding:0 0 40px;
  -webkit-text-size-adjust:100%;
}

.magazine{padding:0 22px;}

.magazine>h1:first-child{
  background:#144a3c;
  color:#f6f4ee;
  font-family:"Playfair Display","Noto Serif SC",serif;
  font-weight:900;
  font-size:32px;
  line-height:1.12;
  letter-spacing:-0.015em;
  margin:0 -22px 26px;
  padding:28px 22px 24px;
}
.magazine>h1:first-child::before{
  content:"FEATURE";
  display:block;
  font-family:"Inter",sans-serif;
  font-weight:600;
  font-size:10.5px;
  letter-spacing:.32em;
  color:#d4af37;
  margin-bottom:11px;
}

h2{
  font-family:"Playfair Display","Noto Serif SC",serif;
  font-weight:800;
  font-size:21px;
  color:#144a3c;
  margin:32px 0 12px;
  line-height:1.3;
}
h2::before{
  content:"";
  display:inline-block;width:18px;height:1.5px;background:#d4af37;
  vertical-align:middle;margin-right:10px;margin-bottom:3px;
}

h3{font-family:"Inter",sans-serif;font-weight:600;font-size:15.5px;color:#26241f;margin:20px 0 8px;text-transform:uppercase;letter-spacing:.05em;}

p{margin:13px 0;}
strong{color:#144a3c;font-weight:600;}
em{color:#6b6358;}

a{color:#144a3c;text-decoration:underline;text-decoration-color:rgba(212,175,55,.7);text-decoration-thickness:1.5px;text-underline-offset:2px;}

code{
  font-family:"JetBrains Mono",monospace;font-size:.85em;color:#144a3c;background:#ece9df;padding:1px 5px;border-radius:2px;word-break:break-word;
}
pre{
  background:#1d2622;color:#e6e3d8;border-radius:4px;padding:15px 16px;margin:16px 0;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;
}
pre code{background:transparent;color:inherit;padding:0;font-size:12.5px;line-height:1.6;}

blockquote{
  margin:22px 0;padding:12px 18px;
  border-left:2px solid #d4af37;background:#ece9df;
  color:#3a3530;
  font-family:"Playfair Display","Noto Serif SC",serif;
  font-size:17px;font-style:italic;line-height:1.5;
}

ul,ol{padding-left:22px;margin:13px 0;}
li{margin:6px 0;}
li::marker{color:#d4af37;}

hr{border:none;border-top:1px solid #d8d2c4;margin:28px 0;}

table{border-collapse:collapse;width:100%;margin:16px 0;font-size:14px;}
th,td{border:1px solid #d8d2c4;padding:8px 10px;text-align:left;}
th{background:#ece9df;color:#144a3c;font-weight:600;}

img{max-width:100%;height:auto;}
</style>
</head>
<body>
<article class="magazine">
{{body}}
</article>
</body>
</html>
